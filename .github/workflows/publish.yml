name: Publish to npm

# Publishes all @tederash/* packages when a GitHub Release is published.
# Uses npm Trusted Publishing (OIDC) — no npm token is stored or used.
# The extension (private: true) is excluded by the filter.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    # Registers this run in the repository's Deployments sidebar.
    # The environment name must match the "environment" field in the
    # trusted publisher configuration on npmjs.com.
    environment:
      name: npm
      url: https://www.npmjs.com/org/tederash
    steps:
      - uses: actions/checkout@v6

      # pnpm version comes from packageManager in the root package.json.
      - uses: pnpm/action-setup@v4

      # Node 24 ships npm >= 11.x. Do NOT set NODE_AUTH_TOKEN anywhere:
      # its presence disables the OIDC flow.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only the four library packages; prepublishOnly runs build + tests
      # per package before each one is packed and uploaded.
      - name: Publish packages
        run: pnpm --filter "./packages/*" publish --access public --no-git-checks
